# PostgreSQL dedicado ao projeto (porta 5433 no host — evita conflito com Postgres local na 5432).
services:
  db:
    image: postgres:16-alpine
    container_name: cobranca-condominial-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cobranca
      POSTGRES_PASSWORD: cobranca_dev
      POSTGRES_DB: cobranca_condominial
    ports:
      - "5433:5432"
    volumes:
      - cobranca_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobranca -d cobranca_condominial"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cobranca_pg_data:
