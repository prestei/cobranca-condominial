name: Deploy produção

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: VPS danieljorgeadv.com
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY}" || { echo "Secret VPS_SSH_PRIVATE_KEY ausente"; exit 1; }
          test -n "${VPS_HOST}" || { echo "Secret VPS_HOST ausente"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Atualizar código na VPS (git)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          set -euo pipefail
          USER_NAME="${VPS_USER:-root}"
          APP_DIR="${VPS_APP_DIR:-/opt/cobranca-condominial}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          REMOTE_URL="https://github.com/${{ github.repository }}.git"
          SCRIPT_B64="$(base64 -w0 deploy/scripts/remote-git-sync.sh)"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${USER_NAME}@${VPS_HOST}" \
            "mkdir -p '${APP_DIR}' && \
            echo '${SCRIPT_B64}' | base64 -d > /tmp/cobranca-remote-git-sync.sh && \
            chmod +x /tmp/cobranca-remote-git-sync.sh && \
            APP_DIR='${APP_DIR}' DEPLOY_BRANCH='${BRANCH}' REMOTE_URL='${REMOTE_URL}' \
            GITHUB_DEPLOY_TOKEN='${DEPLOY_REPO_TOKEN:-}' \
            bash /tmp/cobranca-remote-git-sync.sh"

      - name: Build e restart na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          USER_NAME="${VPS_USER:-root}"
          APP_DIR="${VPS_APP_DIR:-/opt/cobranca-condominial}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${USER_NAME}@${VPS_HOST}" \
            "APP_DIR='${APP_DIR}' bash '${APP_DIR}/deploy/scripts/ci-remote-deploy.sh'"
