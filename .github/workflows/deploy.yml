name: Deploy produção

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: VPS danieljorgeadv.com
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY}" || { echo "Secret VPS_SSH_PRIVATE_KEY ausente"; exit 1; }
          test -n "${VPS_HOST}" || { echo "Secret VPS_HOST ausente"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sincronizar código (preserva .env.production)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          USER_NAME="${VPS_USER:-root}"
          APP_DIR="${VPS_APP_DIR:-/opt/cobranca-condominial}"
          RSYNC_RSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${USER_NAME}@${VPS_HOST}" "mkdir -p '${APP_DIR}'"
          rsync -az --delete \
            -e "$RSYNC_RSH" \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            --exclude .freebuff \
            --exclude deploy/secrets \
            --exclude 'deploy/.env.production' \
            --exclude 'deploy/.env.standby' \
            --exclude '*.tsbuildinfo' \
            --exclude .env \
            --exclude .env.local \
            ./ "${USER_NAME}@${VPS_HOST}:${APP_DIR}/"

      - name: Build e restart na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          USER_NAME="${VPS_USER:-root}"
          APP_DIR="${VPS_APP_DIR:-/opt/cobranca-condominial}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${USER_NAME}@${VPS_HOST}" \
            "APP_DIR='${APP_DIR}' bash '${APP_DIR}/deploy/scripts/ci-remote-deploy.sh'"
