# Stack do banco espelho — VPS de contingência
# Uso (na VPS standby):
#   docker compose -f docker-compose.standby.yml --env-file .env.standby up -d
name: cobranca-standby

services:
  db-standby:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      PRIMARY_HOST: ${PRIMARY_HOST:?IP_ou_host_da_VPS_principal}
      PRIMARY_PORT: ${PRIMARY_PORT:-5432}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?defina REPLICATION_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cobranca_condominial}
      POSTGRES_USER: ${POSTGRES_USER:-cobranca}
    volumes:
      - pgdata_standby:/var/lib/postgresql/data
      - ./postgres/standby/entrypoint-standby.sh:/entrypoint-standby.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-standby.sh"]
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || pg_isready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  pgdata_standby:
